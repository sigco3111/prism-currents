<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>프리즘 커런츠 (Prism Currents)</title>
    <meta property="og:title" content="프리즘 커런츠 (Prism Currents)" />
    <meta property="og:description" content="컬 노이즈 물살에 실려 흐르는 프리즘 리본. WebGL2 트랜스폼 피드백으로 GPU에서 시뮬레이션하고, 아웃라인·화면 공간 앰비언트 오클루전·안개를 적용한 디퍼드 패스로 렌더링합니다. 프리셋을 고르거나 컨트롤 패널에서 흐름, 형상, 팔레트, 카메라를 바꿔 보세요." />
    <meta property="og:image" content="https://sigco3111.github.io/prism-currents/screenshot.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="importmap">
      {
        "imports": {
          "tweakpane": "./vendor/tweakpane.mjs",
          "wtc-gl": "./vendor/wtc-gl.mjs"
        }
      }
    </script>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f1eef2;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: grab;
      }
      .hint {
        position: fixed;
        left: 16px;
        bottom: 14px;
        font:
          12px/1.4 ui-monospace,
          Menlo,
          monospace;
        color: rgba(60, 40, 50, 0.5);
        pointer-events: none;
        user-select: none;
      }
      .hint .credit {
        opacity: 0.75;
      }
      .hint-mobile {
        display: none;
      }
      @media (pointer: coarse) {
        .hint-desktop {
          display: none;
        }
        .hint-mobile {
          display: inline;
        }
      }
      .debug-tile {
        position: fixed;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.5);
        outline: 1px solid rgba(0, 0, 0, 0.35);
        padding: 3px 5px;
        display: flex;
        align-items: flex-end;
        font:
          11px/1.3 ui-monospace,
          Menlo,
          monospace;
        color: #fff;
        text-shadow:
          0 0 3px #000,
          0 0 1px #000;
        pointer-events: none;
        user-select: none;
      }
      .debug-tile.off {
        background: rgba(20, 20, 30, 0.6);
      }
      .debug-tile.off::after {
        content: " (피사계 심도를 켜세요)";
        white-space: pre;
      }
      .dark body {
        background: #0e0c10;
      }
      .dark .hint {
        color: rgba(235, 225, 230, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="hint">
      <span class="hint-desktop"
        >드래그: 회전 · 휠: 확대/축소 · 오른쪽 위 패널에서 프리셋·팔레트 조정, 이미지 저장</span
      >
      <span class="hint-mobile">드래그: 회전 · 핀치: 확대/축소 · 오른쪽 위 패널에서 프리셋 선택</span>
      <br />
      <span class="credit">원작: Liam Egan — Prism Currents (MIT)</span>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
